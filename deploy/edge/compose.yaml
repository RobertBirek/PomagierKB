# Stack EDGE (PomagierKB): Caddy (TLS/ingress) + Authentik (SSO) + Postgres + Redis.
# Jedyne porty na hoście: 80/tcp, 443/tcp, 443/udp (Caddy, HTTP/3).
# Sieć edge-net tworzona raz, poza compose: docker network create edge-net
#
# Limity `pids_limit` i `cpus` = twarde bezpieczniki (audyt D1-08): żaden kontener nie może
# wysycić tablicy procesów ani wszystkich 8 vCPU hosta i zdusić logowania (SSO) całej
# platformy. Wartości = zmierzony baseline `docker stats` (PIDs) razy ~5-10 zapasu.

name: edge

x-security-defaults: &security_defaults
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Wspólne środowisko authentik-server i authentik-worker (jeden obraz, dwa procesy)
x-authentik-env: &authentik_env
  TZ: ${TZ:-Europe/Warsaw}
  AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?AUTHENTIK_SECRET_KEY is required}
  # Bootstrap (działa TYLKO przy pierwszym starcie na pustej bazie; potem ignorowane)
  AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
  AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
  AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-}
  AUTHENTIK_POSTGRESQL__HOST: edge-postgres
  AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_PG_USER:?AUTHENTIK_PG_USER is required}
  AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_PG_DB:?AUTHENTIK_PG_DB is required}
  AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASSWORD:?AUTHENTIK_PG_PASSWORD is required}
  AUTHENTIK_REDIS__HOST: edge-redis
  AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
  AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
  AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
  # SMTP (opcjonalnie, gdy będzie konto — odkomentować też zmienne w .env):
  # AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL__HOST:-}
  # AUTHENTIK_EMAIL__PORT: ${AUTHENTIK_EMAIL__PORT:-587}
  # AUTHENTIK_EMAIL__USERNAME: ${AUTHENTIK_EMAIL__USERNAME:-}
  # AUTHENTIK_EMAIL__PASSWORD: ${AUTHENTIK_EMAIL__PASSWORD:-}
  # AUTHENTIK_EMAIL__USE_TLS: ${AUTHENTIK_EMAIL__USE_TLS:-true}
  # AUTHENTIK_EMAIL__FROM: ${AUTHENTIK_EMAIL__FROM:-}

services:
  caddy:
    <<: [*security_defaults, *logging]
    image: ${CADDY_IMAGE:?CADDY_IMAGE is required}
    container_name: edge-caddy
    restart: always
    mem_limit: 256m
    pids_limit: 256     # baseline 13 (Go: wątki skalują się z GOMAXPROCS)
    cpus: 2             # TLS/HTTP3 dla całego ingressu — zapas na szczyt handshake'ów
    cap_add:
      - NET_BIND_SERVICE   # bind 80/443 przy cap_drop ALL
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"      # HTTP/3
    environment:
      TZ: ${TZ:-Europe/Warsaw}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_ROOT:?DATA_ROOT is required}/edge/caddy/data:/data    # certy LE — KRYTYCZNE do backupu
      - ${DATA_ROOT}/edge/caddy/config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/metrics >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      edge-net:
        # Hairpin OIDC: kontenery w edge-net (panel-api) widzą publiczne vhosty
        # przez caddy, bez NAT reflection i z prawdziwym certem LE.
        aliases:
          - auth.ilovelighting.sanok.pl
          - kag.ilovelighting.sanok.pl
          # status.* dołączony 2026-09-07: bez aliasu monitor Uptime Kumy pilnujący
          # bramki SSO rozwiązywał nazwę na PUBLICZNY adres hosta i wisiał do timeoutu
          # (brak NAT reflection dla ruchu kontener→własny adres publiczny).
          - status.ilovelighting.sanok.pl

  authentik-server:
    <<: [*security_defaults, *logging]
    image: ${AUTHENTIK_IMAGE:?AUTHENTIK_IMAGE is required}
    container_name: edge-authentik-server
    restart: always
    command: server
    mem_limit: 1g
    pids_limit: 1024    # baseline 31; gunicorn + embedded outpost pod obciążeniem rosną
    cpus: 2
    environment: *authentik_env
    # BEZ docker.sock — używamy wyłącznie embedded outpostu (nic nie zarządza kontenerami).
    volumes:
      - ${DATA_ROOT}/edge/authentik/media:/media
      - ${DATA_ROOT}/edge/authentik/custom-templates:/templates
      - ${DATA_ROOT}/edge/authentik/certs:/certs
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge-net
      - edge-internal

  authentik-worker:
    <<: [*security_defaults, *logging]
    image: ${AUTHENTIK_IMAGE:?AUTHENTIK_IMAGE is required}
    container_name: edge-authentik-worker
    restart: always
    command: worker
    mem_limit: 1g
    pids_limit: 1024    # baseline 15; worker forkuje zadania (migracje, wysyłki, backupy)
    cpus: 2
    environment: *authentik_env
    # BEZ docker.sock — embedded outpost żyje w procesie authentik-server.
    volumes:
      - ${DATA_ROOT}/edge/authentik/media:/media
      - ${DATA_ROOT}/edge/authentik/custom-templates:/templates
      - ${DATA_ROOT}/edge/authentik/certs:/certs
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge-internal
      - edge-net   # egress SMTP (powiadomienia e-mail w przyszłości)

  postgres:
    <<: [*security_defaults, *logging]
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    container_name: edge-postgres
    restart: always
    mem_limit: 512m
    pids_limit: 512     # baseline 17 (proces na połączenie)
    cpus: 2
    cap_add:
      # minimalny zestaw: entrypoint startuje jako root, chown-uje wolumen danych
      # przy pierwszej inicjalizacji i zrzuca uprawnienia do usera postgres
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      TZ: ${TZ:-Europe/Warsaw}
      POSTGRES_USER: ${AUTHENTIK_PG_USER:?AUTHENTIK_PG_USER is required}
      POSTGRES_DB: ${AUTHENTIK_PG_DB:?AUTHENTIK_PG_DB is required}
      POSTGRES_PASSWORD: ${AUTHENTIK_PG_PASSWORD:?AUTHENTIK_PG_PASSWORD is required}
    volumes:
      - ${DATA_ROOT}/edge/authentik/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - edge-internal

  redis:
    <<: [*security_defaults, *logging]
    image: ${REDIS_IMAGE:?REDIS_IMAGE is required}
    container_name: edge-redis
    restart: always
    mem_limit: 256m
    pids_limit: 256     # baseline 6 (Redis jednowątkowy + wątki I/O)
    cpus: 1
    cap_add:
      # entrypoint zrzuca uprawnienia do usera redis (su-exec)
      - SETGID
      - SETUID
    command: --save 60 1 --loglevel warning
    environment:
      TZ: ${TZ:-Europe/Warsaw}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - edge-internal

  # ── Uptime Kuma (OPCJONALNY monitoring; profil "monitoring") ──────────────
  # Start: docker compose --profile monitoring up -d
  # Dostęp: https://status.ilovelighting.sanok.pl za forward-auth (patrz Caddyfile
  # i docs/authentik-setup.md §Kuma); wymaga rekordu DNS A dla status.*
  uptime-kuma:
    <<: [*security_defaults, *logging]
    image: ${KUMA_IMAGE:-louislam/uptime-kuma@sha256:3e24e96c89efff0e3a4b0698cbdd36c15ad3022371db57166e5588853002ee5c} # 2.5.3, pin 2026-09-07
    container_name: edge-uptime-kuma
    profiles: ["monitoring"]
    # ŻADNYCH cap_add. Kuma 1.x zrzucała uprawnienia przez setpriv i wymagała
    # SETUID/SETGID/CHOWN; 2.x ma entrypoint `dumb-init -- node server/server.js`
    # i zostaje rootem, więc nic z tego nie jest potrzebne. Co więcej, CAP_CHOWN
    # AKTYWNIE PSUŁO start (2026-09-07): przy pierwszym uruchomieniu Kuma robi
    # `fs.copyFileSync('./db/kuma.db', 'data/kuma.db')`, a libuv po skopiowaniu
    # ustawia na pliku docelowym właściciela ŹRÓDŁA (node, uid 1000) i dopiero
    # potem jego tryb — fchmod na pliku, którego proces po chownie już nie jest
    # właścicielem, wymaga CAP_FOWNER. Efekt: `EPERM ... copyfile` i pętla
    # restartów na ekranie /setup-database. Bez CAP_CHOWN chown się nie wykonuje,
    # kopia zostaje rootem i copyfile przechodzi. Zweryfikowane empirycznie:
    # cap_drop ALL bez dodatków → OK; +CHOWN → EPERM; +CHOWN+FOWNER → OK.
    restart: unless-stopped
    mem_limit: 384m
    pids_limit: 256     # baseline 19 (Node + wbudowany sqlite)
    cpus: 1             # monitoring nie ma prawa konkurować z ingressem i SSO
    environment:
      TZ: ${TZ:-Europe/Warsaw}
    volumes:
      - ${DATA_ROOT:?DATA_ROOT is required}/edge/kuma:/app/data
    healthcheck:
      # Kuma 2.x dostarcza skompilowany `extra/healthcheck` i sam go deklaruje w obrazie;
      # wariant `node extra/healthcheck.js` z 1.x nadal istnieje, ale upstream go porzucił.
      test: ["CMD", "extra/healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - edge-net

networks:
  # wspólna sieć proxy dla obecnych i przyszłych appek (caddy ↔ kag-panel/kag-mcp)
  edge-net:
    external: true
  # izolacja Postgresa/Redisa od świata (bez NAT, bez internetu)
  edge-internal:
    internal: true

# Stack "kag" — PomagierKB: OpenSPG (mysql/neo4j/minio/server) + ekstrakcja (tika/stirling)
# + panel + MCP.
#
# Zasady (docs/design/infra.md §3 + PLAN.md):
# - ZERO portów publikowanych na hoście (nawet 127.0.0.1); ingress wyłącznie przez
#   edge-caddy w edge-net, diagnostyka przez `docker compose exec`.
# - Nazwy kontenerów OpenSPG MUSZĄ być release-openspg-* (hardkod minio, issue #396).
# - Wartości RAM/heapów z .env — profil 24 GB (PLAN.md); skalowanie bez edycji compose.
# - Sekrety wymuszane przez ${X:?...} — brak wartości = stack nie wstaje (fail-fast).
# - Limity `pids_limit` i `cpus` = twarde bezpieczniki (audyt D1-08), NIE knob wydajności:
#   uszkodzony/złośliwy dokument w parserze niezaufanych uploadów (Stirling: LibreOffice +
#   unoserver + Xvfb + tesseract; Tika: parsery Javy) albo zapętlony builder nie mogą
#   zjeść wszystkich 8 vCPU hosta ani wysycić tablicy procesów. Wartości = zmierzony
#   baseline `docker stats` (PIDs) razy ~5-10 zapasu; zmiana wymaga edycji tego pliku
#   (świadomie: to kontrola bezpieczeństwa, więc ma być widoczna w gicie).

name: kag

# Kotwice hardeningowe wspólne dla wszystkich usług
x-security-defaults: &security_defaults
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Dłuższe okno dla kontenerów, których stdout jest JEDYNYM trwałym śladem zdarzeń
# bezpieczeństwa. Audyt 2026-09-06 (D6-17): Neo4j deklaruje appendery plikowe
# (security.log, query.log) i `db.logs.query.enabled=VERBOSE`, ale pliki są puste od startu —
# zmienne NEO4J_* nadpisują konfigurację log4j z obrazu. Nieudane uwierzytelnienia bolt
# widać wyłącznie w `docker logs`, a przy 10 MB × 3 okno historyczne kurczy się do godzin.
# 20 MB × 10 = 200 MB na kontener; przy 391 GB wolnego miejsca to koszt pomijalny wobec
# możliwości zbadania incydentu po fakcie.
x-logging-audit: &logging_audit
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "10"

services:
  mysql:
    <<: [*security_defaults, *logging]
    # minimalne capabilities: entrypoint zrzuca uprawnienia do usera mysql
    cap_add:
      - SETUID
      - SETGID
      - CHOWN          # entrypoint chown /var/lib/mysql przy pierwszym starcie
      - DAC_OVERRIDE   # katalog danych 700/999 — root bez tej cap nie wejdzie (cap_drop ALL)
    image: ${OPENSPG_MYSQL_IMAGE:?OPENSPG_MYSQL_IMAGE is required}
    container_name: release-openspg-mysql
    restart: always
    mem_limit: ${MYSQL_MEM_LIMIT:-2g}
    pids_limit: 512     # baseline 18 (thread-per-connection: pula OpenSPG + builder)
    cpus: 2
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    environment:
      TZ: ${TZ:-Europe/Warsaw}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-openspg}
      # Audyt 2026-09-06 (D6-07): entrypoint obrazu domyślnie zakłada `root@'%'`
      # (docker-entrypoint.sh: `file_env 'MYSQL_ROOT_HOST' '%'`), czyli konto roota
      # z pełnymi uprawnieniami osiągalne z KAŻDEGO kontenera w sieci kag-datastores.
      # Zawężamy do pętli zwrotnej. `root@localhost` (po sockecie) powstaje niezależnie
      # od tej zmiennej, więc `mysqldump` w backup.sh działa bez zmian, a healthcheck
      # niżej łączy się po TCP na 127.0.0.1 i trafia właśnie na to konto.
      #
      # UWAGA: działa TYLKO przy inicjalizacji PUSTEGO wolumenu. Na działającej instalacji
      # konto `root@'%'` trzeba usunąć ręcznie — procedura (wraz z kolejnością, bo
      # skip_name_resolve=ON) w docs/design/audit-2026-09-operator.md §B1.
      MYSQL_ROOT_HOST: 127.0.0.1
      # dla mysql-init/10-create-app-user.sh — serwer OpenSPG łączy się jako user
      # aplikacyjny, NIE root
      MYSQL_APP_USER: ${MYSQL_APP_USER:?MYSQL_APP_USER is required}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}
    healthcheck:
      # hasło przez env MYSQL_PWD, nie w argv (niewidoczne w `ps` wewnątrz kontenera).
      # REALNE ZAPYTANIE, nie `mysqladmin ping`: ping zwraca SUKCES nawet przy odmowie
      # dostępu (zweryfikowane 2026-09-07 na efemerycznym kontenerze — ping ze złym
      # hasłem kończy się kodem 0). Kontener z zepsutym kontem roota raportowałby się
      # jako healthy. Ta sama lekcja stoi już w verify_backup.sh przy sondzie gotowości.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql -h 127.0.0.1 --protocol=tcp -uroot -N -e 'SELECT 1' >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - ${DATA_ROOT:?DATA_ROOT is required}/kag/mysql:/var/lib/mysql
      # skrypty inicjalizacyjne — wykonywane RAZ, przy pustym wolumenie danych
      # UWAGA: montaż POJEDYNCZEGO pliku — obraz ma własne initdb.sql/openspg-initdb.sql
      # w tym katalogu (schemat kg_*); montaż całego katalogu by je PRZYKRYŁ.
      - ./mysql-init/10-create-app-user.sh:/docker-entrypoint-initdb.d/zz-create-app-user.sh:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      # datastores: OpenSPG i jego bazy odseparowane od parserow niezaufanych tresci
      - kag-datastores

  neo4j:
    # logging_audit, nie logging: stdout to jedyny trwały ślad nieudanych logowań bolt (D6-17)
    <<: [*security_defaults, *logging_audit]
    # minimalne capabilities: entrypoint obrazu chown-uje /data i zrzuca uprawnienia
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    image: ${OPENSPG_NEO4J_IMAGE:?OPENSPG_NEO4J_IMAGE is required}
    container_name: release-openspg-neo4j
    restart: always
    mem_limit: ${NEO4J_MEM_LIMIT:-4g}
    pids_limit: 1024    # baseline 92 wątków JVM (pids_limit liczy też wątki)
    cpus: 4
    environment:
      TZ: ${TZ:-Europe/Warsaw}
      # osobne zmienne dla healthchecku (cypher-shell)
      OPENSPG_NEO4J_USER: ${OPENSPG_NEO4J_USER:?OPENSPG_NEO4J_USER is required}
      OPENSPG_NEO4J_PASSWORD: ${OPENSPG_NEO4J_PASSWORD:?OPENSPG_NEO4J_PASSWORD is required}
      NEO4J_AUTH: ${OPENSPG_NEO4J_USER:?OPENSPG_NEO4J_USER is required}/${OPENSPG_NEO4J_PASSWORD:?OPENSPG_NEO4J_PASSWORD is required}
      NEO4J_PLUGINS: '["apoc"]'
      # Audyt 2026-09-06 (D6-09): import/eksport plików przez APOC był WŁĄCZONY. Ktokolwiek ma
      # poświadczenia bolt — a ma je serwer OpenSPG, którego API /public/** jest bez
      # uwierzytelnienia (D6-03) — mógł czytać i zapisywać pliki wewnątrz kontenera Neo4j.
      # Pipeline PomagierKB nigdy nie używa APOC do plików: eksport idzie CSV-em przez builder
      # OpenSPG, który sam pobiera pliki z MinIO. Wyłączone.
      NEO4J_apoc_import_file_enabled: "false"
      NEO4J_apoc_export_file_enabled: "false"
      # LOAD CSV z adresów URL — nieużywane u nas, a to kolejny wektor SSRF obok D6-12.
      NEO4J_dbms_security_allow__csv__import__from__file__urls: "false"
      # UWAGA: `unrestricted`/`allowlist` = apoc.* zostaje świadomie. Zawężenie wymaga
      # potwierdzenia buildem na StagingSmoke, że builder OpenSPG nie woła żadnej procedury
      # APOC (przesłanka: zapisuje sterownikiem) — procedura jest w liście zadań operatora.
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
      # profil 24 GB: heap 2G / pagecache 1G (PLAN.md)
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-2G}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-2G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-1G}
    healthcheck:
      # poświadczenia przez env cypher-shella, nie w argv
      test: ["CMD-SHELL", "NEO4J_USERNAME=\"$${OPENSPG_NEO4J_USER}\" NEO4J_PASSWORD=\"$${OPENSPG_NEO4J_PASSWORD}\" cypher-shell 'RETURN 1;' >/dev/null"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s
    volumes:
      - ${DATA_ROOT:?DATA_ROOT is required}/kag/neo4j/data:/data
      - ${DATA_ROOT:?DATA_ROOT is required}/kag/neo4j/logs:/logs
      - ${DATA_ROOT:?DATA_ROOT is required}/kag/neo4j/plugins:/plugins
      - ${DATA_ROOT:?DATA_ROOT is required}/kag/neo4j/import:/import
      - /etc/localtime:/etc/localtime:ro
    networks:
      # datastores: OpenSPG i jego bazy odseparowane od parserow niezaufanych tresci
      - kag-datastores

  minio:
    <<: [*security_defaults, *logging]
    image: ${OPENSPG_MINIO_IMAGE:?OPENSPG_MINIO_IMAGE is required}
    container_name: release-openspg-minio
    restart: always
    mem_limit: ${MINIO_MEM_LIMIT:-768m}
    pids_limit: 512     # baseline 14 (runtime Go skaluje wątki z GOMAXPROCS)
    cpus: 2
    command:
      - server
      - --console-address
      - :9001
      - /data
    environment:
      TZ: ${TZ:-Europe/Warsaw}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    volumes:
      - ${DATA_ROOT:?DATA_ROOT is required}/kag/minio:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      # datastores: OpenSPG i jego bazy odseparowane od parserow niezaufanych tresci
      - kag-datastores

  server:
    <<: [*security_defaults, *logging]
    image: ${OPENSPG_SERVER_IMAGE:?OPENSPG_SERVER_IMAGE is required}
    container_name: release-openspg-server
    restart: always
    mem_limit: ${OPENSPG_SERVER_MEM_LIMIT:-4608m}
    # baseline 95 wątków; builder (BUILDER_MODEL_EXECUTE_NUM=4) zwielokrotnia pule
    pids_limit: 1024
    cpus: 4             # builder nie może zagłodzić panelu/MCP/Authentika
    # Patch klienta OpenAI PRZED startem Javy; błąd patcha = kontener nie wstaje (fail-fast)
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - /home/admin/miniconda3/bin/python /opt/openspg/patch_openspg_openai_client.py && exec java -jar arks-sofaboot-0.0.1-SNAPSHOT-executable.jar
    environment:
      TZ: ${TZ:-Europe/Warsaw}
      # profil 24 GB: Xms 1g / Xmx 3g (PLAN.md)
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Xms${OPENSPG_SERVER_XMS:-1024m} -Xmx${OPENSPG_SERVER_XMX:-3072m}
      SERVER_REPOSITORY_IMPL_JDBC_HOST: release-openspg-mysql
      SERVER_REPOSITORY_IMPL_JDBC_USERNAME: ${MYSQL_APP_USER:?MYSQL_APP_USER is required}
      SERVER_REPOSITORY_IMPL_JDBC_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}
      # równoległość buildera (profil 24 GB: 4)
      BUILDER_MODEL_EXECUTE_NUM: ${BUILDER_MODEL_EXECUTE_NUM:-4}
      # UWAGA: OpenSPG wymaga sekretów inline w URL-ach (ograniczenie upstreamu) —
      # widoczne w `docker inspect`; ograniczać członkostwo w grupie docker.
      # Hasła w URL-ach = warianty *_URLENCODED z .env.
      CLOUDEXT_GRAPHSTORE_URL: neo4j://release-openspg-neo4j:7687?user=${OPENSPG_NEO4J_USER:?OPENSPG_NEO4J_USER is required}&password=${OPENSPG_NEO4J_PASSWORD_URLENCODED:?OPENSPG_NEO4J_PASSWORD_URLENCODED is required}&database=neo4j
      CLOUDEXT_SEARCHENGINE_URL: neo4j://release-openspg-neo4j:7687?user=${OPENSPG_NEO4J_USER:?OPENSPG_NEO4J_USER is required}&password=${OPENSPG_NEO4J_PASSWORD_URLENCODED:?OPENSPG_NEO4J_PASSWORD_URLENCODED is required}&database=neo4j
      CLOUDEXT_OBJECTSTORAGE_URL: minio://release-openspg-minio:9000?accessKey=${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}&secretKey=${MINIO_ROOT_PASSWORD_URLENCODED:?MINIO_ROOT_PASSWORD_URLENCODED is required}
      # Tłumienie logów — PEMJA i AppController na INFO logowały configi modeli Z KLUCZAMI API.
      # ReasonerServiceImpl doszedł po audycie 2026-09-06 (D6-02): logował na INFO cały obiekt
      # wejściowy zadania razem z `graphStoreUrl`, a ten niesie hasło Neo4j w postaci
      # `password=<32 znaki>`. Wyciek trafiał do plików w warstwie zapisywalnej kontenera
      # i przeżywał 30 dziennych rotacji. WARN zostawia komunikaty o błędach reasonera.
      LOGGING_LEVEL_COM_ANTGROUP_OPENSPG_COMMON_UTIL_PEMJA: "OFF"
      SPRING_APPLICATION_JSON: '{"logging.level.com.antgroup.openspgapp.api.http.server.app.AppController":"OFF","logging.level.com.antgroup.openspg.server.core.reasoner.service.impl.ReasonerServiceImpl":"WARN"}'
      LOGGING_LEVEL_COM_ANTGROUP_OPENSPG_SERVER_ARKS_SOFABOOT: WARN
      LOGGING_LEVEL_COM_ANTGROUP_OPENSPGAPP_ARKS_SOFABOOT: WARN
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -I --max-time 5 http://127.0.0.1:8887/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    volumes:
      - ./openspg/patch_openspg_openai_client.py:/opt/openspg/patch_openspg_openai_client.py:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      mysql:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      # datastores zamiast kag-internal: port 8887 (bez auth) widzą tylko panel i mcp —
      # Tika/Stirling (parsery NIEZAUFANYCH uploadów) nie mają do niego drogi.
      - kag-datastores
      # JEDYNA usługa z egresem — wywołania API LLM (wektoryzacja, ekstrakcja)
      - kag-egress

  tika:
    <<: [*security_defaults, *logging]
    image: ${TIKA_IMAGE:?TIKA_IMAGE is required}
    container_name: kag-tika
    restart: unless-stopped
    mem_limit: ${TIKA_MEM_LIMIT:-1536m}
    # GŁÓWNY WEKTOR: parsuje NIEZAUFANE uploady (parsery Javy). Baseline 40 wątków.
    pids_limit: 512
    cpus: 2
    environment:
      TZ: ${TZ:-Europe/Warsaw}
    healthcheck:
      # obraz nie ma curl/wget — test TCP przez basha
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9998"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - kag-internal

  stirling:
    <<: [*security_defaults, *logging]
    image: ${STIRLING_IMAGE:?STIRLING_IMAGE is required}
    container_name: kag-stirling
    restart: unless-stopped
    cap_add:          # entrypoint Stirlinga: chown /pipeline + setpriv (zrzucanie uprawnień)
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    mem_limit: ${STIRLING_MEM_LIMIT:-2g}
    # GŁÓWNY WEKTOR: OCR/konwersja NIEZAUFANYCH plików uruchamia LibreOffice, unoserver,
    # Xvfb i tesseract — najłatwiejsze miejsce na lawinę procesów. Baseline 67.
    pids_limit: 1024
    cpus: 3             # OCR dużego skanu ma być szybki, ale nie kosztem reszty hosta
    environment:
      TZ: ${TZ:-Europe/Warsaw}
      # usługa żyje tylko w kag-internal (bez ingressu z internetu i bez egresu) —
      # kontrolę dostępu zapewnia sieć, nie login aplikacji
      SECURITY_ENABLELOGIN: "false"
      SYSTEM_DEFAULTLOCALE: pl-PL
      JAVA_OPTS: ${STIRLING_JAVA_OPTS:--Xmx1g}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/v1/info/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      # pol/eng/osd.traineddata pobiera deterministycznie bootstrap.sh (tessdata_fast) —
      # OCR po polsku bez zależności od wariantu "fat" obrazu i egresu kontenera
      - ${DATA_ROOT:?DATA_ROOT is required}/kag/stirling/tessdata:/usr/share/tessdata
    networks:
      - kag-internal

  panel:
    <<: [*security_defaults, *logging]
    image: kag-panel:local
    build:
      # kontekst = korzeń monorepo (npm workspaces)
      context: ../..
      dockerfile: services/panel/Dockerfile
      # Tożsamość wydania (D12-14). Bez tych argumentów Dockerfile wstawia do etykiet OCI
      # wartość "unknown" — czyli po deployu nie da się ustalić, z jakiego commitu działa
      # produkcja. Wartości podaje procedura deployu:
      #   GIT_SHA=$(git -C /kag rev-parse --short HEAD) BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILT_AT: ${BUILT_AT:-unknown}
    container_name: kag-panel
    restart: unless-stopped
    mem_limit: ${PANEL_MEM_LIMIT:-1536m}   # 512m → 1536m (2026-09-09): build 14 600 chunków = OOM potomka przy 256 MB sterty
    pids_limit: 512     # baseline 11; jobs/ spawnuje procesy potomne (ekstrakcja, eksport)
    cpus: 2
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      TZ: ${TZ:-Europe/Warsaw}
      NODE_ENV: production
      PORT: "8080"
      # sterta V8 procesów potomnych jobs/ (build/eksport) — patrz services/actions-runner.ts
      JOB_NODE_MAX_OLD_SPACE_MB: ${JOB_NODE_MAX_OLD_SPACE_MB:-1024}
      # SQLite WAL + inbox + exporty CSV + audyt JSONL
      DATA_DIR: /data
      # nazwy env czytane przez apps/panel-api/src/config.ts; wartości z .env (PANEL_*)
      PUBLIC_URL: ${PANEL_PUBLIC_URL:?PANEL_PUBLIC_URL is required}
      OIDC_ISSUER: ${PANEL_OIDC_ISSUER:?PANEL_OIDC_ISSUER is required}
      OIDC_CLIENT_ID: ${PANEL_OIDC_CLIENT_ID:?PANEL_OIDC_CLIENT_ID is required}
      OIDC_CLIENT_SECRET: ${PANEL_OIDC_CLIENT_SECRET:?PANEL_OIDC_CLIENT_SECRET is required}
      SESSION_SECRET: ${PANEL_SESSION_SECRET:?PANEL_SESSION_SECRET is required}
      TOKEN_ENC_KEY: ${TOKEN_ENC_KEY:?TOKEN_ENC_KEY is required}
      # wspólny sekret panel<->mcp (X-Internal-Token dla POST /invalidate)
      INTERNAL_TOKEN: ${PANEL_INTERNAL_TOKEN:?PANEL_INTERNAL_TOKEN is required}
      MCP_INTERNAL_URL: http://kag-mcp:8091
      MCP_HEALTH_URL: http://kag-mcp:3001/healthz
      OPENSPG_BASE_URL: http://release-openspg-server:8887
      OPENSPG_ACCOUNT: ${OPENSPG_ACCOUNT:?OPENSPG_ACCOUNT is required}
      OPENSPG_PASSWORD: ${OPENSPG_PASSWORD:?OPENSPG_PASSWORD is required}
      TIKA_URL: http://kag-tika:9998
      STIRLING_URL: http://kag-stirling:8080
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      # wspólny wolumen panel+mcp: SQLite WAL (jeden pisarz = panel; mcp czyta), uid 10001
      - ${DATA_ROOT:?DATA_ROOT is required}/kag/panel:/data
    depends_on:
      server:
        condition: service_healthy
    networks:
      - kag-internal
      - kag-datastores
      # ingress z Caddy + egress do LLM i do Authentika (aliasy caddy w edge-net)
      - edge-net

  mcp:
    <<: [*security_defaults, *logging]
    image: kag-mcp:local
    build:
      context: ../..
      dockerfile: services/mcp/Dockerfile
      # jak wyżej — patrz komentarz przy usłudze panel (D12-14)
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILT_AT: ${BUILT_AT:-unknown}
    container_name: kag-mcp
    restart: unless-stopped
    mem_limit: ${MCP_MEM_LIMIT:-384m}
    pids_limit: 256     # baseline 11 (Node bez procesów potomnych)
    cpus: 2
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      TZ: ${TZ:-Europe/Warsaw}
      NODE_ENV: production
      PORT: "3001"
      # ta sama baza SQLite co panel (migracje robi TYLKO panel; mcp sprawdza wersję schematu)
      DATA_DIR: /data
      # sekret X-Internal-Token dla POST /invalidate (panel-api -> mcp :8091)
      INTERNAL_TOKEN: ${PANEL_INTERNAL_TOKEN:?PANEL_INTERNAL_TOKEN is required}
      # unseal ustawien LLM z SQLite (kb_answer); ten sam klucz co panel
      TOKEN_ENC_KEY: ${TOKEN_ENC_KEY:?TOKEN_ENC_KEY is required}
      PUBLIC_URL: ${MCP_PUBLIC_URL:?MCP_PUBLIC_URL is required}
      OPENSPG_BASE_URL: http://release-openspg-server:8887
      OPENSPG_ACCOUNT: ${OPENSPG_ACCOUNT:?OPENSPG_ACCOUNT is required}
      OPENSPG_PASSWORD: ${OPENSPG_PASSWORD:?OPENSPG_PASSWORD is required}
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ${DATA_ROOT:?DATA_ROOT is required}/kag/panel:/data
    depends_on:
      panel:
        condition: service_healthy
    networks:
      # mcp nie używa Tika/Stirling — wystarczą datastores (OpenSPG) i edge (ingress)
      - kag-datastores
      - edge-net

networks:
  # internal: true — brak NAT/internetu; parsery treści (Tika/Stirling) + panel
  kag-internal:
    internal: true
  # internal: true — OpenSPG (8887 bez auth!) i jego bazy; TYLKO panel i mcp
  # (infra.md „faza 2": separacja od parserów niezaufanych uploadów)
  kag-datastores:
    internal: true
  # egress TYLKO dla release-openspg-server (API LLM)
  kag-egress:
    driver: bridge
  # wspólna sieć z edge-caddy (utworzona raz: docker network create edge-net)
  edge-net:
    external: true

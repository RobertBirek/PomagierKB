  #       condition: service_healthy

  # mcp-server:                                 # odkomentuj po Fazie 3/5
  #   build:
  #     context: .
  #     dockerfile: services/mcp/Dockerfile
  #   environment:
  #     DB_PATH: /data/kag.db
  #     OPENSPG_BASE_URL: http://openspg-stub:8887
  #   ports:
  #     - "127.0.0.1:8090:8090"
  #   volumes:
  #     - dev-data:/data
  #   networks: [dev]
  #   depends_on:
  #     - openspg-stub

volumes:
  dev-data:

networks:
  dev:

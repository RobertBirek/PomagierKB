name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # walidacja interpolacji obu stacków na .env.example (sekrety przykładowe)
      - run: |
          for STACK in edge kag; do
            if [ -f deploy/$STACK/.env.example ]; then
              cp deploy/$STACK/.env.example deploy/$STACK/.env
              docker compose -f deploy/$STACK/compose.yaml config -q
              rm deploy/$STACK/.env
            fi
          done

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
